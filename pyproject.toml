# Pytest configuration only - the project installs its runtime deps from
# requirements.txt (unpinned for now) and its test-only deps from
# requirements-dev.txt. There's deliberately no [project] table yet;
# "Pits" isn't packaged/distributed, it's run as scripts.

[tool.pytest.ini_options]
testpaths = ["tests"]
# The two script dirs aren't a package, so make their modules importable
# by bare name (import supabase_store / fastF1_ingestion_script / query_agent)
# the same way the scripts import each other at runtime.
pythonpath = ["ingestion", "query_agent"]
addopts = "-ra"
